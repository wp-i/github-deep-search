<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GitHub Deep Search 本地 Web 开发基线">
  <title>GitHub Deep Search</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">GitHub Deep Search · 0.1.0</p>
      <h1>从完整需求中，找到最相关的三个开源项目</h1>
      <p class="lead">
        产品契约已经完成重设。六阶段搜索正在重建，当前页面只用于确认本地服务和凭据配置。
      </p>
    </header>

    <section class="panel" aria-labelledby="status-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">本地状态</p>
          <h2 id="status-heading">运行前检查</h2>
        </div>
        <span id="service-state" class="badge badge-pending">检查中</span>
      </div>

      <div class="status-grid">
        <article class="status-card">
          <span>GitHub Token</span>
          <strong id="github-status">检查中</strong>
        </article>
        <article class="status-card">
          <span>LLM API</span>
          <strong id="llm-status">检查中</strong>
        </article>
        <article class="status-card">
          <span>搜索流水线</span>
          <strong id="search-status">重建中</strong>
        </article>
      </div>
    </section>

    <section class="panel" aria-labelledby="search-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow">输入</p>
          <h2 id="search-heading">描述你的想法或需求</h2>
        </div>
        <span class="badge">最多 2000 字符</span>
      </div>
      <textarea
        aria-label="需求描述"
        maxlength="2000"
        placeholder="六阶段搜索完成后可在这里输入需求"
        disabled
      ></textarea>
      <button type="button" disabled>搜索功能重建中</button>
      <p class="notice">
        当前基线不会调用旧搜索引擎，也不会生成或保存报告。
      </p>
    </section>
  </main>

  <script src="/static/app.js" defer></script>
</body>
</html>
