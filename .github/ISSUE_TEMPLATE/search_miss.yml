name: Search quality miss
description: Share a query where the results were missing, noisy, or poorly ranked.
title: "[Search miss]: "
labels: ["search-quality"]
body:
  - type: textarea
    id: query
    attributes:
      label: Exact query
      description: Paste the requirement you searched for.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What kind of project did you expect?
      description: Link any known repositories if you have them.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What did GitHub Deep Search return?
      description: Include the three results, failure message, or copied Markdown without credentials or private input.
  - type: checkboxes
    id: credentials
    attributes:
      label: Required configuration
      options:
        - label: The run used both a GitHub token and an LLM API key.
          required: true
    validations:
      required: true
